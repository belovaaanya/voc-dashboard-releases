<body>
  <div class="app">
  <!-- J-115: боковое меню — страницы дашборда, данные выгрузки и методика; сворачивается до иконок -->
  <nav class="side-nav" id="side-nav" aria-label="Разделы дашборда"></nav>
  <!-- Рабочая область: панель с шапкой и страницей; верх панели — на уровне верха меню -->
  <main class="workspace">
  <div class="page dashboard-surface">
    <div id="header"></div>

    <!-- J-151: страницы дашборда — пункты меню; видна одна, main.js скрывает остальные и не считает их блоки -->
    <div class="page-view" id="page-voc" data-page="voc">
    <!-- J-189: шапка — сетка метрик: VOC канала слева на две строки, справа сегменты, под ними дни плана, распределение и вывод -->
    <div class="metrics-grid" id="metrics"></div>

    <!-- J-40, J-?: группа аналитики — строка-заголовок с общим периодом над тремя карточками: «Динамика и события»
         (график и календарь событий в одну строку), «Антидрайверы», «Топ проблем» с лентой; main.js оборачивает слот -->
    <div class="group-slot" id="analysis">
      <section class="card group-card" aria-label="Динамика и события">
      <div class="group-row">
        <div class="column" id="main"></div>
        <div class="column column--bounded" id="rail-main"></div>
      </div>
      </section>
      <div class="column" id="drivers"></div>
      <div class="column" id="problems"></div>
    </div>

    <!-- Неделя 16–22.11: таблица прямой речи — внизу «Для аналитика», после «Топ проблем»; на главной колонка скрыта
         (data-mode="analyst"). Отдельной страницы «Обратная связь» (J-151) больше нет -->
    <div class="column" id="full" data-mode="analyst" hidden></div>

    </div>

    <!-- J-151, J-154: «VOC-дайджест» — строки одной высоты: итог месяца; три сегмента; антидрайверы ДКО на всю ширину;
         стабильность и детализация рядом (треть и две трети) -->
    <div class="page-view digest" id="page-digest" data-page="digest" hidden>
      <div class="digest__top" id="digest-top"></div>
      <div class="digest__segments" id="digest-segments"></div>
      <div class="digest__dko" id="digest-dko"></div>
      <div class="digest__pair" id="digest-side"></div>
    </div>

    <!-- J-151: «VOC ролей» — страница в работе -->
    <div class="page-view" id="page-roles" data-page="roles" hidden>
      <div class="column" id="roles"></div>
    </div>
  </div>
  </main>
  </div>

  <script type="module" src="js/main.js?v=5ea3173b35"></script>
</body>
</html>
