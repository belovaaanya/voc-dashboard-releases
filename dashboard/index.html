<body>
  <div class="app">
  <!-- J-115: боковое меню — страницы дашборда, данные выгрузки и методика; сворачивается до иконок -->
  <nav class="side-nav" id="side-nav" aria-label="Разделы дашборда"></nav>
  <!-- Рабочая область (макет дизайнера 11.11): строка действий и панель с шапкой и страницей -->
  <main class="workspace">
  <div class="workspace-toolbar" id="workspace-toolbar"></div>
  <div class="page dashboard-surface">
    <div id="header"></div>

    <!-- J-151: страницы дашборда — пункты меню; видна одна, main.js скрывает остальные и не считает их блоки -->
    <div class="page-view" id="page-voc" data-page="voc">
    <!-- J-189: шапка — сетка метрик: VOC канала слева на две строки, справа сегменты, под ними дни плана, распределение и вывод -->
    <div class="metrics-grid" id="metrics"></div>

    <!-- J-40, J-49: блок аналитики — одна карточка с общим периодом; слева график и антидрайверы под ним,
         справа события на всю высоту группы; main.js оборачивает слот в карточку группы -->
    <div class="group-slot" id="analysis">
      <div class="group-row">
        <div class="column group-stack">
          <div class="column" id="main"></div>
          <div class="column group-section" id="drivers"></div>
        </div>
        <div class="column column--bounded" id="rail-main"></div>
      </div>
      <!-- J-128: топ проблем с лентой — под графиком и календарём; лента шириной календаря -->
      <div class="column group-section" id="problems"></div>
    </div>

    </div>

    <!-- J-151: «Обратная связь» — таблица прямой речи (с J-128 была отдельной карточкой внизу главной) -->
    <div class="page-view" id="page-feedback" data-page="feedback" hidden>
    <div class="group-slot" id="verbatim">
      <div class="column" id="full"></div>
    </div>
    </div>

    <!-- J-151, J-154: «VOC-дайджест» — строки одной высоты: итог месяца; три сегмента; антидрайверы ДКО на всю ширину;
         стабильность и детализация рядом (треть и две трети) -->
